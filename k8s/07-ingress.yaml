apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devopsforge-ingress
  namespace: devops-lab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: devopsforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devopsforge-service
                port:
                  number: 80

