version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Main Application Service
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devopsforge_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - DB_HOST=postgres
    depends_on:
      - redis
      - postgres
    networks:
      - devops_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # -------------------------------------------------------------
  # 2. Redis In-Memory Cache (Microservices Layer)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: devopsforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - devops_network

  # -------------------------------------------------------------
  # 3. PostgreSQL Database (Persistence Layer)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: devopsforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_secret_password
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops_network

  # -------------------------------------------------------------
  # 4. Prometheus (Observability & Metrics Collector)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devopsforge_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - devops_network

  # -------------------------------------------------------------
  # 5. Nginx (Reverse Proxy & Ingress Simulator)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: devopsforge_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - devops_network

networks:
  devops_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:

