name: DevOpsForge CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =============================================================
  # Stage 1: Continuous Integration (Lint & Automated Tests)
  # =============================================================
  test-and-lint:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  # =============================================================
  # Stage 2: Containerization & Security Vulnerability Scanning
  # =============================================================
  security-and-build:
    name: 🐳 Docker Build & Trivy Scan
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devopsforge:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devopsforge:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Non-blocking for learning demo
          severity: 'CRITICAL,HIGH'

  # =============================================================
  # Stage 3: Kubernetes Manifest Dry-Run Validation
  # =============================================================
  k8s-validate:
    name: ☸️ Validate K8s Manifests
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Dry-run Validate Manifests
        run: |
          echo "Validating Kubernetes Manifests syntax..."
          kubectl apply --dry-run=client -f k8s/

