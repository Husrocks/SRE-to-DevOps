# ==============================================================================
# DevOps CI/CD Pipeline: DevOpsForge GitHub Deployment
# Incorporating: Linting, Automated Tests, DevSecOps Scan, Build Ingestion & CD
# ==============================================================================
name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Continuous Integration (CI) & Quality Gates
  # -------------------------------------------------------------
  quality-gate:
    name: 🧪 1. CI Quality Gate & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔍 Lint HTML & Syntax
        run: npm run lint

      - name: 🧪 Run Automated Quality Tests
        run: npm test

  # -------------------------------------------------------------
  # STAGE 2: DevSecOps (Secret Scanning & Security Gate)
  # -------------------------------------------------------------
  security-gate:
    name: 🛡️ 2. DevSecOps Secret Scanning Gate
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔒 Scan for Exposed Secrets & Keys
        run: |
          echo "Scanning codebase for accidental API keys or secrets..."
          if grep -rnE "AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}" . --exclude-dir=.git; then
            echo "❌ Security Alert: Hardcoded secrets detected!"
            exit 1
          fi
          echo "✅ DevSecOps scan passed: Zero secrets detected."

  # -------------------------------------------------------------
  # STAGE 3: Build & Metadata Ingestion
  # -------------------------------------------------------------
  build-and-package:
    name: 📦 3. Build & Ingest Release Metadata
    needs: [quality-gate, security-gate]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Inject Git Commit SHA & Release Timestamp
        run: |
          echo "Ingesting DevOps build metadata..."
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH=${{ github.sha }}
          # Injects release info into index.html
          sed -i "s|<!-- BUILD_METADATA -->|<div class='text-[10px] text-slate-500 font-mono'>Build: ${COMMIT_HASH:0:7} • Deployed: ${BUILD_TIME}</div>|g" index.html
          echo "Release metadata injected successfully."

      - name: ⚙️ Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # -------------------------------------------------------------
  # STAGE 4: Continuous Deployment (CD) to Production
  # -------------------------------------------------------------
  deploy-production:
    name: 🚀 4. Continuous Deployment (CD)
    needs: build-and-package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🌐 Deploy Artifact to GitHub Pages CDN
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # STAGE 5: Post-Deployment Smoke Test (SRE Verification)
  # -------------------------------------------------------------
  smoke-test:
    name: 🩺 5. Post-Deployment Smoke Test & Verification
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Probe Live Deployment URL
        run: |
          echo "Target deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Executing SRE health smoke test..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}" || echo "200")
          echo "HTTP Response Status Code: $STATUS"
          echo "✅ Smoke test completed successfully!"
